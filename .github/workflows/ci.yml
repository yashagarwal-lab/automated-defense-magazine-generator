name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
          playwright install --with-deps chromium

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      - name: Render Print Magazine & Web Reader
        run: |
          mag-gen render
          mag-gen reader

      - name: Verify Zero DOM Text Overflow (50 Pages)
        run: |
          mag-gen check

      - name: Compile Print PDF
        run: |
          mag-gen pdf

      - name: Verify PDF 50-Page Invariant
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          PAGE_COUNT=$(pdfinfo output/Securing_the_Northeast_Magazine.pdf | grep "Pages:" | awk '{print $2}')
          echo "Verified Page Count: $PAGE_COUNT"
          if [ "$PAGE_COUNT" -ne 50 ]; then
            echo "Error: PDF page count is $PAGE_COUNT, expected exactly 50"
            exit 1
          fi
