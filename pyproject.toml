[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magazine-generator"
version = "1.0.0"
description = "Autonomous multi-page defense publication compiler & automated typesetter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yash Agarwal" }]
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.2",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0"
]

[project.scripts]
mag-gen = "magazine_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
